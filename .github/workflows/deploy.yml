# path: .github/workflows/deploy.yml
# Deploy on merge to main — Doc #2 §6, Doc #7 §6.
#
# Frontend → Render static site (or Vercel — toggle via deploy_target input).
# Backend  → Render web service (paid Starter tier, persistent disk).
#
# Secrets must be configured in the GitHub repo:
#   RENDER_API_KEY        — Render API key (or VERCEL_TOKEN for Vercel)
#   LLM_FAST_API_KEY      ─┐
#   LLM_REASONING_API_KEY ─┤ passed through to the deployed service
#   JWT_SECRET_KEY         ┘
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-deploy: true
        env:
          LLM_FAST_API_KEY: ${{ secrets.LLM_FAST_API_KEY }}
          LLM_REASONING_API_KEY: ${{ secrets.LLM_REASONING_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SIMULATOR_AUTH_TOKEN: ${{ secrets.SIMULATOR_AUTH_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-deploy: true

  smoke-test:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test against deployed backend
        run: bash scripts/smoke-test.sh https://crewlink-ai-backend.onrender.com

      - name: Run smoke test against deployed frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://crewlink-ai-frontend.onrender.com/)
          echo "Frontend status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: frontend returned $STATUS"; exit 1; }
