[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crewlinai-backend"
version = "0.1.0"
description = "CrewLink AI — FIFA World Cup 2026 Volunteer Command Assistant (Backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "chromadb>=0.6.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.9.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["tests*", "alembic*"]
namespaces = true

[tool.setuptools.package-data]
"backend.app.seed" = ["*.csv", "*.json", "*.txt"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "llm: marks tests that exercise an AI call site (golden-set / LLM component tests). Run separately in mocked-integration.",
]

[tool.mypy]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["backend.app.models.*", "backend.app.db.base", "backend.app.*", "app.models.*", "app.db.*", "app.*"]
disable_error_code = "misc"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]
ignore = ["B008"]  # Depends() in FastAPI defaults is the standard pattern
